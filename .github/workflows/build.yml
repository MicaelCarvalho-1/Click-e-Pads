name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os arquivos
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar o app
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm install
          npx cap add android
          npx cap sync android

      - name: Manter a tela ligada com o app aberto
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          echo "Arquivo encontrado: $F"
          cat > "$F" <<'JAVA'
          package com.micael.clickpads;

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              }
          }
          JAVA

      - name: Gerar o APK
        working-directory: android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ClickePads-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
